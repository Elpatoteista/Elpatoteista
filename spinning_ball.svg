<svg xmlns="http://www.w3.org/2000/svg" width="300" height="230" viewBox="0 0 300 230">
  <defs>
    <!-- Crisp 2-tone clean basketball gradient -->
    <radialGradient id="cleanBall" cx="36%" cy="32%" r="68%">
      <stop offset="0%" stop-color="#FF7A38"/>
      <stop offset="70%" stop-color="#FF5722"/>
      <stop offset="100%" stop-color="#E64A19"/>
    </radialGradient>

    <!-- Minimalist sleek highlight -->
    <path id="ballHighlight" d="M -30 -24 A 42 42 0 0 1 12 -38 A 38 38 0 0 0 -22 -14 Z" fill="#FFFFFF" opacity="0.35"/>

    <!-- Exact spherical clipping mask for seams -->
    <clipPath id="ballClip">
      <circle cx="0" cy="0" r="44"/>
    </clipPath>
  </defs>

  <style>
    /* Snappy, energetic dribble physics */
    @keyframes dribbleBounce {
      0% {
        transform: translateY(152px) scale(1.12, 0.88);
        animation-timing-function: cubic-bezier(0.24, 0.85, 0.45, 1);
      }
      18% {
        transform: translateY(118px) scale(0.96, 1.04);
        animation-timing-function: cubic-bezier(0.35, 0.45, 0.55, 0.95);
      }
      50% {
        transform: translateY(58px) scale(1, 1);
        animation-timing-function: cubic-bezier(0.55, 0.05, 0.7, 0.55);
      }
      82% {
        transform: translateY(124px) scale(0.97, 1.03);
        animation-timing-function: cubic-bezier(0.7, 0, 0.85, 0.2);
      }
      92% {
        transform: translateY(155px) scale(1.16, 0.84);
        animation-timing-function: cubic-bezier(0.1, 0.9, 0.3, 1.1);
      }
      100% {
        transform: translateY(152px) scale(1.12, 0.88);
      }
    }

    @keyframes smoothSpin {
      0%   { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    @keyframes floorShadow {
      0% {
        transform: scale(1.15, 1);
        opacity: 0.32;
        animation-timing-function: cubic-bezier(0.24, 0.85, 0.45, 1);
      }
      50% {
        transform: scale(0.65, 0.65);
        opacity: 0.10;
        animation-timing-function: cubic-bezier(0.55, 0.05, 0.7, 0.55);
      }
      92% {
        transform: scale(1.25, 1.1);
        opacity: 0.38;
      }
      100% {
        transform: scale(1.15, 1);
        opacity: 0.32;
      }
    }

    .ball-container {
      transform-origin: 0 0;
      animation: dribbleBounce 0.9s infinite;
    }

    .seam-group {
      transform-origin: 0 0;
      animation: smoothSpin 2s linear infinite;
    }

    .floor-shadow {
      transform-origin: 150px 198px;
      animation: floorShadow 0.9s infinite;
      fill: #1A1D20;
    }

    .court-line {
      stroke: #E0E0E0;
      transition: stroke 0.3s ease;
    }

    .code-tag {
      font-family: 'Fira Code', ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 11.5px;
      font-weight: 600;
      fill: #6E7681;
      letter-spacing: 0.5px;
    }

    @media (prefers-color-scheme: dark) {
      .floor-shadow { fill: #000000; }
      .court-line { stroke: #2D333B; }
      .code-tag { fill: #8B949E; }
    }
  </style>

  <!-- Clean minimalist court ground line -->
  <line class="court-line" x1="80" y1="198" x2="220" y2="198" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="3 5"/>

  <!-- Clean, subtle soft floor shadow -->
  <ellipse class="floor-shadow" cx="150" cy="198" rx="34" ry="5.5"/>

  <!-- Ball Entity -->
  <g transform="translate(150, 0)">
    <g class="ball-container">
      <!-- 1. Ball Body (Crisp vibrant orange circle) -->
      <circle cx="0" cy="0" r="44" fill="url(#cleanBall)"/>

      <!-- 2. Rotating Seams (Clean black lines clipped to sphere) -->
      <g clip-path="url(#ballClip)">
        <g class="seam-group">
          <g stroke="#181A1B" stroke-width="2.6" stroke-linecap="round" fill="none">
            <!-- Center Cross Lines -->
            <line x1="-50" y1="0" x2="50" y2="0"/>
            <line x1="0" y1="-50" x2="0" y2="50"/>

            <!-- Symmetrical Basketball Arcs -->
            <path d="M -21 -40 C -4 -18 -4 18 -21 40"/>
            <path d="M 21 -40 C 4 -18 4 18 21 40"/>
          </g>
        </g>
      </g>

      <!-- 3. Clean Vector Highlight Arc -->
      <use href="#ballHighlight"/>

      <!-- 4. Crisp Outer Border -->
      <circle cx="0" cy="0" r="44" fill="none" stroke="#D84315" stroke-width="1.2"/>
    </g>
  </g>

  <!-- Clean Minimalist Caption -->
  <text class="code-tag" x="150" y="222" text-anchor="middle">
    while (alive) dribble();
  </text>
</svg>

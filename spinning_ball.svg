<svg xmlns="http://www.w3.org/2000/svg" width="320" height="250" viewBox="0 0 320 250">
  <defs>
    <!-- Realistic 3D Basketball Gradient -->
    <radialGradient id="ballShading" cx="35%" cy="30%" r="68%">
      <stop offset="0%" stop-color="#FF7A30"/>
      <stop offset="45%" stop-color="#E64A19"/>
      <stop offset="78%" stop-color="#BF360C"/>
      <stop offset="95%" stop-color="#681900"/>
      <stop offset="100%" stop-color="#3E0B00"/>
    </radialGradient>

    <!-- Specular Highlight (Light source stays fixed while ball rotates) -->
    <radialGradient id="topGlow" cx="32%" cy="26%" r="48%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.45"/>
      <stop offset="45%" stop-color="#FFFFFF" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>

    <!-- Deep Ambient Occlusion Shadow -->
    <radialGradient id="innerShadow" cx="68%" cy="72%" r="60%">
      <stop offset="0%" stop-color="#000000" stop-opacity="0"/>
      <stop offset="65%" stop-color="#210500" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.75"/>
    </radialGradient>

    <!-- Soft Dynamic Floor Shadow -->
    <radialGradient id="floorShadowGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#D84315" stop-opacity="0.4"/>
      <stop offset="35%" stop-color="#1A0500" stop-opacity="0.6"/>
      <stop offset="70%" stop-color="#000000" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>

    <!-- Ball Mask ensuring seams and textures stay strictly inside the ball -->
    <clipPath id="ballMask">
      <circle cx="0" cy="0" r="46"/>
    </clipPath>

    <!-- Impact Ring Gradient -->
    <radialGradient id="rippleGrad" cx="50%" cy="50%" r="50%">
      <stop offset="70%" stop-color="#FF5722" stop-opacity="0"/>
      <stop offset="90%" stop-color="#FF5722" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#FF7043" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <style>
    @keyframes realisticBounce {
      0% {
        transform: translateY(168px) scale(1.18, 0.82);
        animation-timing-function: cubic-bezier(0.2, 0.9, 0.4, 1.0);
      }
      14% {
        transform: translateY(142px) scale(0.94, 1.08);
        animation-timing-function: cubic-bezier(0.25, 0.46, 0.45, 0.94);
      }
      50% {
        transform: translateY(68px) scale(1.0, 1.0);
        animation-timing-function: cubic-bezier(0.55, 0.085, 0.68, 0.53);
      }
      86% {
        transform: translateY(150px) scale(0.95, 1.07);
        animation-timing-function: cubic-bezier(0.7, 0, 0.84, 0);
      }
      94% {
        transform: translateY(172px) scale(1.24, 0.76);
        animation-timing-function: cubic-bezier(0.15, 0.85, 0.35, 1.2);
      }
      100% {
        transform: translateY(168px) scale(1.18, 0.82);
      }
    }

    @keyframes continuousSpin {
      0%   { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    @keyframes shadowPulse {
      0% {
        transform: scale(1.28, 1.0);
        opacity: 0.75;
        animation-timing-function: cubic-bezier(0.2, 0.9, 0.4, 1.0);
      }
      14% {
        transform: scale(1.0, 0.9);
        opacity: 0.5;
        animation-timing-function: cubic-bezier(0.25, 0.46, 0.45, 0.94);
      }
      50% {
        transform: scale(0.55, 0.5);
        opacity: 0.18;
        animation-timing-function: cubic-bezier(0.55, 0.085, 0.68, 0.53);
      }
      86% {
        transform: scale(0.95, 0.85);
        opacity: 0.45;
        animation-timing-function: cubic-bezier(0.7, 0, 0.84, 0);
      }
      94% {
        transform: scale(1.38, 1.15);
        opacity: 0.85;
      }
      100% {
        transform: scale(1.28, 1.0);
        opacity: 0.75;
      }
    }

    @keyframes impactShockwave {
      0%, 88% {
        transform: scale(0.4);
        opacity: 0;
      }
      94% {
        transform: scale(0.8);
        opacity: 0.7;
      }
      100% {
        transform: scale(1.4);
        opacity: 0;
      }
    }

    .ball-rig {
      transform-origin: 0 0;
      animation: realisticBounce 0.95s infinite;
    }

    .rotating-seams {
      transform-origin: 0 0;
      animation: continuousSpin 2.2s linear infinite;
    }

    .shadow-ellipse {
      transform-origin: 160px 212px;
      animation: shadowPulse 0.95s infinite;
    }

    .shockwave {
      transform-origin: 160px 212px;
      animation: impactShockwave 0.95s infinite;
    }

    .tagline {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Fira Code', Roboto, monospace;
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 0.8px;
      fill: #8b949e;
      transition: fill 0.3s ease;
    }

    @media (prefers-color-scheme: dark) {
      .tagline { fill: #c9d1d9; }
    }
  </style>

  <!-- Ground Court Reflection / Line -->
  <line x1="60" y1="212" x2="260" y2="212" stroke="#FF3B3F" stroke-width="1.5" stroke-dasharray="4 6" opacity="0.25"/>

  <!-- Shockwave Ring on Bounce Impact -->
  <ellipse class="shockwave" cx="160" cy="212" rx="42" ry="7" fill="url(#rippleGrad)"/>

  <!-- Dynamic Floor Shadow -->
  <ellipse class="shadow-ellipse" cx="160" cy="212" rx="38" ry="6" fill="url(#floorShadowGrad)"/>

  <!-- Bouncing Ball Rig (Positioned dynamically at center X=160) -->
  <g transform="translate(160, 0)">
    <g class="ball-rig">
      <!-- 1. Solid Ball Base with Rich Radial Shading -->
      <circle cx="0" cy="0" r="46" fill="url(#ballShading)"/>

      <!-- 2. Rotating Seams (Clipped strictly to ball geometry) -->
      <g clip-path="url(#ballMask)">
        <g class="rotating-seams">
          <!-- Leather Pebble Texture Micro-grid -->
          <circle cx="0" cy="0" r="46" fill="none" stroke="#FFFFFF" stroke-width="0.7" stroke-dasharray="1 3" opacity="0.12"/>
          
          <!-- Classic Deep Inset Basketball Seams -->
          <g stroke="#180400" stroke-width="2.8" stroke-linecap="round" fill="none">
            <!-- Equator & Meridian -->
            <line x1="-50" y1="0" x2="50" y2="0"/>
            <line x1="0" y1="-50" x2="0" y2="50"/>

            <!-- Symmetrical Curved Ribs with accurate spherical projection -->
            <path d="M -22 -42 C -5 -20 -5 20 -22 42"/>
            <path d="M 22 -42 C 5 -20 5 20 22 42"/>
          </g>
          <!-- Secondary seam accent line for etched leather depth -->
          <g stroke="#FFA07A" stroke-width="0.8" stroke-linecap="round" fill="none" opacity="0.25">
            <path d="M -21 -42 C -4 -20 -4 20 -21 42"/>
            <path d="M 23 -42 C 6 -20 6 20 23 42"/>
          </g>
        </g>
      </g>

      <!-- 3. Fixed Lighting Layer (Does NOT rotate, keeping volume illusion 100% convincing) -->
      <circle cx="0" cy="0" r="46" fill="url(#topGlow)" pointer-events="none"/>
      <circle cx="0" cy="0" r="46" fill="url(#innerShadow)" pointer-events="none"/>

      <!-- 4. Subtle Outer Rim Stroke -->
      <circle cx="0" cy="0" r="46" fill="none" stroke="#501000" stroke-width="1.6" opacity="0.6"/>
    </g>
  </g>

  <!-- Sleek Modern Status Badge / Caption -->
  <g transform="translate(160, 238)">
    <text class="tagline" text-anchor="middle">
      &lt;dribbling_code /&gt; ⚡
    </text>
  </g>
</svg>

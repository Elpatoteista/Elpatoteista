<svg xmlns="http://www.w3.org/2000/svg" width="300" height="240" viewBox="0 0 300 240">
  <defs>
    <!-- Basketball gradient -->
    <radialGradient id="ballGrad" cx="40%" cy="35%" r="50%">
      <stop offset="0%" stop-color="#FF6B35"/>
      <stop offset="60%" stop-color="#E83030"/>
      <stop offset="100%" stop-color="#8B1A1A"/>
    </radialGradient>
    <!-- Shine -->
    <radialGradient id="shine" cx="35%" cy="30%" r="25%">
      <stop offset="0%" stop-color="white" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="white" stop-opacity="0"/>
    </radialGradient>
    <!-- Clip for seam rotation -->
    <clipPath id="ballClip">
      <circle cx="150" cy="100" r="44"/>
    </clipPath>
  </defs>

  <style>
    @keyframes bounce {
      0%   { transform: translateY(0px) scaleY(1) scaleX(1); }
      45%  { transform: translateY(-30px) scaleY(1.05) scaleX(0.97); }
      50%  { transform: translateY(-32px) scaleY(1.05) scaleX(0.97); }
      55%  { transform: translateY(-30px) scaleY(1.05) scaleX(0.97); }
      90%  { transform: translateY(0px) scaleY(1) scaleX(1); }
      95%  { transform: translateY(2px) scaleY(0.92) scaleX(1.06); }
      100% { transform: translateY(0px) scaleY(1) scaleX(1); }
    }
    @keyframes spin-seams {
      0%   { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    @keyframes shadow-squish {
      0%   { rx: 36; ry: 5; opacity: 0.3; }
      45%  { rx: 24; ry: 3; opacity: 0.1; }
      50%  { rx: 22; ry: 3; opacity: 0.08; }
      55%  { rx: 24; ry: 3; opacity: 0.1; }
      90%  { rx: 36; ry: 5; opacity: 0.3; }
      95%  { rx: 42; ry: 7; opacity: 0.35; }
      100% { rx: 36; ry: 5; opacity: 0.3; }
    }
    @keyframes trail1 {
      0%, 40%  { opacity: 0; }
      50%      { opacity: 0.15; }
      60%, 100% { opacity: 0; }
    }
    @keyframes trail2 {
      0%, 35%  { opacity: 0; }
      48%      { opacity: 0.1; }
      58%, 100% { opacity: 0; }
    }
    @keyframes trail3 {
      0%, 30%  { opacity: 0; }
      45%      { opacity: 0.06; }
      55%, 100% { opacity: 0; }
    }
    @keyframes impact {
      0%, 88% { opacity: 0; transform: scaleX(0.5); }
      94%     { opacity: 0.4; transform: scaleX(1); }
      100%    { opacity: 0; transform: scaleX(1.5); }
    }

    .bounce-group {
      transform-origin: 150px 144px;
      animation: bounce 0.9s cubic-bezier(0.25, 0, 0.6, 1) infinite;
    }
    .seams {
      transform-origin: 150px 100px;
      animation: spin-seams 2s linear infinite;
    }
    .shadow {
      animation: shadow-squish 0.9s cubic-bezier(0.25, 0, 0.6, 1) infinite;
    }
    .trail-1 { animation: trail1 0.9s cubic-bezier(0.25, 0, 0.6, 1) infinite; }
    .trail-2 { animation: trail2 0.9s cubic-bezier(0.25, 0, 0.6, 1) infinite; }
    .trail-3 { animation: trail3 0.9s cubic-bezier(0.25, 0, 0.6, 1) infinite; }
    .impact-line {
      transform-origin: 150px 148px;
      animation: impact 0.9s cubic-bezier(0.25, 0, 0.6, 1) infinite;
    }
    .label { fill: #666; }
    @media (prefers-color-scheme: dark) {
      .label { fill: #888; }
    }
  </style>

  <!-- Shadow on ground -->
  <ellipse class="shadow" cx="150" cy="168" rx="36" ry="5" fill="#FF3B3F"/>

  <!-- Impact lines -->
  <g class="impact-line">
    <line x1="110" y1="168" x2="100" y2="168" stroke="#FF3B3F" stroke-width="2" stroke-linecap="round"/>
    <line x1="190" y1="168" x2="200" y2="168" stroke="#FF3B3F" stroke-width="2" stroke-linecap="round"/>
  </g>

  <!-- Motion trails (visible during fall) -->
  <circle class="trail-1" cx="150" cy="62" r="43" fill="none" stroke="#FF3B3F" stroke-width="1" opacity="0"/>
  <circle class="trail-2" cx="150" cy="52" r="41" fill="none" stroke="#FF3B3F" stroke-width="0.8" opacity="0"/>
  <circle class="trail-3" cx="150" cy="42" r="39" fill="none" stroke="#FF3B3F" stroke-width="0.5" opacity="0"/>

  <!-- Bouncing group -->
  <g class="bounce-group">
    <!-- Ball base -->
    <circle cx="150" cy="100" r="44" fill="url(#ballGrad)"/>

    <!-- Spinning seams clipped to ball -->
    <g class="seams" clip-path="url(#ballClip)">
      <!-- === MAIN CROSS SEAMS === -->
      <!-- Horizontal band -->
      <line x1="100" y1="100" x2="200" y2="100" stroke="#1a0a0a" stroke-width="3" opacity="0.7"/>
      <!-- Vertical band -->
      <line x1="150" y1="50" x2="150" y2="150" stroke="#1a0a0a" stroke-width="3" opacity="0.7"/>

      <!-- === CURVED RIBS (8-panel pattern) === -->
      <!-- Top-left rib -->
      <path d="M 150 56 Q 118 72 106 100" fill="none" stroke="#1a0a0a" stroke-width="2.5" opacity="0.6"/>
      <!-- Top-right rib -->
      <path d="M 150 56 Q 182 72 194 100" fill="none" stroke="#1a0a0a" stroke-width="2.5" opacity="0.6"/>
      <!-- Bottom-left rib -->
      <path d="M 106 100 Q 118 128 150 144" fill="none" stroke="#1a0a0a" stroke-width="2.5" opacity="0.6"/>
      <!-- Bottom-right rib -->
      <path d="M 194 100 Q 182 128 150 144" fill="none" stroke="#1a0a0a" stroke-width="2.5" opacity="0.6"/>

      <!-- === SECONDARY CURVED RIBS (depth) === -->
      <!-- Inner top-left -->
      <path d="M 150 62 Q 126 78 112 100" fill="none" stroke="#1a0a0a" stroke-width="1.8" opacity="0.35"/>
      <!-- Inner top-right -->
      <path d="M 150 62 Q 174 78 188 100" fill="none" stroke="#1a0a0a" stroke-width="1.8" opacity="0.35"/>
      <!-- Inner bottom-left -->
      <path d="M 112 100 Q 126 122 150 138" fill="none" stroke="#1a0a0a" stroke-width="1.8" opacity="0.35"/>
      <!-- Inner bottom-right -->
      <path d="M 188 100 Q 174 122 150 138" fill="none" stroke="#1a0a0a" stroke-width="1.8" opacity="0.35"/>

      <!-- === PEBBLE TEXTURE DOTS === -->
      <circle cx="130" cy="82" r="1" fill="#1a0a0a" opacity="0.15"/>
      <circle cx="170" cy="82" r="1" fill="#1a0a0a" opacity="0.15"/>
      <circle cx="130" cy="118" r="1" fill="#1a0a0a" opacity="0.15"/>
      <circle cx="170" cy="118" r="1" fill="#1a0a0a" opacity="0.15"/>
      <circle cx="140" cy="90" r="0.8" fill="#1a0a0a" opacity="0.1"/>
      <circle cx="160" cy="90" r="0.8" fill="#1a0a0a" opacity="0.1"/>
      <circle cx="140" cy="110" r="0.8" fill="#1a0a0a" opacity="0.1"/>
      <circle cx="160" cy="110" r="0.8" fill="#1a0a0a" opacity="0.1"/>
    </g>

    <!-- Highlight / shine -->
    <circle cx="150" cy="100" r="44" fill="url(#shine)"/>

    <!-- Edge ring for depth -->
    <circle cx="150" cy="100" r="44" fill="none" stroke="#6B1010" stroke-width="1.5" opacity="0.4"/>
  </g>

  <!-- Label -->
  <text class="label" x="150" y="200" text-anchor="middle" font-family="'Courier New', monospace" font-size="12" opacity="0.6">
    <tspan>while(true) { ball.bounce(); }</tspan>
  </text>
</svg>

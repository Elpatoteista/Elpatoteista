<svg xmlns="http://www.w3.org/2000/svg" width="300" height="240" viewBox="0 0 300 240">
  <defs>
    <!-- Realistic basketball coloring -->
    <radialGradient id="ballGrad" cx="38%" cy="32%" r="65%">
      <stop offset="0%" stop-color="#FC7B32"/>
      <stop offset="55%" stop-color="#DE4E12"/>
      <stop offset="85%" stop-color="#A62B00"/>
      <stop offset="100%" stop-color="#611500"/>
    </radialGradient>
    
    <!-- Specular highlight for shiny leather feel -->
    <radialGradient id="shine" cx="30%" cy="25%" r="45%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    
    <clipPath id="ballClip">
      <circle cx="150" cy="100" r="43.5"/>
    </clipPath>
  </defs>

  <style>
    @keyframes bounce {
      0%   { transform: translateY(0px) scale(1, 1); animation-timing-function: cubic-bezier(0.2, 0.8, 0.4, 1); }
      50%  { transform: translateY(-50px) scale(0.98, 1.02); animation-timing-function: cubic-bezier(0.6, 0, 0.8, 0.2); }
      90%  { transform: translateY(0px) scale(1, 1); }
      95%  { transform: translateY(5px) scale(1.15, 0.85); }
      100% { transform: translateY(0px) scale(1, 1); }
    }
    @keyframes spin-seams {
      0%   { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    @keyframes shadow-squish {
      0%   { rx: 32px; ry: 4.5px; opacity: 0.3; animation-timing-function: cubic-bezier(0.2, 0.8, 0.4, 1); }
      50%  { rx: 16px; ry: 2.5px; opacity: 0.05; animation-timing-function: cubic-bezier(0.6, 0, 0.8, 0.2); }
      90%  { rx: 32px; ry: 4.5px; opacity: 0.3; }
      95%  { rx: 46px; ry: 6.5px; opacity: 0.5; }
      100% { rx: 32px; ry: 4.5px; opacity: 0.3; }
    }
    @keyframes impact-left {
      0%, 90% { opacity: 0; transform: translate(0, 0); }
      95%     { opacity: 0.6; transform: translate(-8px, 0); }
      100%    { opacity: 0; transform: translate(-14px, 0); }
    }
    @keyframes impact-right {
      0%, 90% { opacity: 0; transform: translate(0, 0); }
      95%     { opacity: 0.6; transform: translate(8px, 0); }
      100%    { opacity: 0; transform: translate(14px, 0); }
    }

    .bounce-group {
      transform-origin: 150px 144px;
      animation: bounce 1.1s infinite;
    }
    .seams {
      transform-origin: 150px 100px;
      animation: spin-seams 2.5s linear infinite;
    }
    .shadow {
      transform-origin: 150px 168px;
      animation: shadow-squish 1.1s infinite;
    }
    .i-left { animation: impact-left 1.1s infinite; }
    .i-right { animation: impact-right 1.1s infinite; }

    .label { fill: #777; font-family: 'Fira Code', 'Courier New', monospace; font-size: 11px; font-weight: bold; }
    @media (prefers-color-scheme: dark) {
      .label { fill: #999; }
      .shadow-dark { fill: #000; }
    }
  </style>

  <!-- Shadow on group so it doesn't get squished by the bounce, but grows and shrinks -->
  <ellipse class="shadow shadow-dark" cx="150" cy="168" rx="32" ry="4.5" fill="#4a1a05" opacity="0.3"/>

  <!-- Impact lines (triggered only when hitting ground) -->
  <line class="i-left" x1="110" y1="168" x2="98" y2="168" stroke="#DE4E12" stroke-width="2" stroke-linecap="round" opacity="0"/>
  <line class="i-right" x1="190" y1="168" x2="202" y2="168" stroke="#DE4E12" stroke-width="2" stroke-linecap="round" opacity="0"/>

  <g class="bounce-group">
    <!-- Ball body -->
    <circle cx="150" cy="100" r="44" fill="url(#ballGrad)"/>

    <!-- Spinning seams -->
    <g class="seams" clip-path="url(#ballClip)">
      <g stroke="#1a0a05" stroke-width="2.5" fill="none">
        <!-- Cross -->
        <line x1="100" y1="100" x2="200" y2="100"/>
        <line x1="150" y1="50" x2="150" y2="150"/>
        
        <!-- Classic Basketball Ribs -->
        <!-- These Q curves use control points nicely aligned to give the spherical illusion -->
        <path d="M 133 45 Q 106 100 133 155"/>
        <path d="M 167 45 Q 194 100 167 155"/>
      </g>
    </g>

    <!-- Shine overlay for volume -->
    <circle cx="150" cy="100" r="44" fill="url(#shine)"/>

    <!-- Depth ring around the edge -->
    <circle cx="150" cy="100" r="44" fill="none" stroke="#521100" stroke-width="1.5" opacity="0.6"/>
  </g>

  <!-- Code Label -->
  <text class="label" x="150" y="210" text-anchor="middle">
    while(alive) ball.bounce();
  </text>
</svg>

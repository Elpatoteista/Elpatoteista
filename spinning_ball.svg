<svg xmlns="http://www.w3.org/2000/svg" width="300" height="220" viewBox="0 0 300 220">
  <style>
    @keyframes spin {
      0%   { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    @keyframes bounce {
      0%, 100% { transform: translateY(0); }
      50%      { transform: translateY(-12px); }
    }
    @keyframes pulse-shadow {
      0%, 100% { opacity: 0.3; rx: 40; }
      50%      { opacity: 0.1; rx: 30; }
    }
    .ball-group {
      animation: bounce 1.2s ease-in-out infinite;
    }
    .ball-spin {
      transform-origin: 150px 90px;
      animation: spin 2.5s linear infinite;
    }
    .shadow {
      animation: pulse-shadow 1.2s ease-in-out infinite;
    }
    .ascii {
      font-family: 'Courier New', Courier, monospace;
      font-size: 13px;
      font-weight: bold;
      fill: #FF3B3F;
    }
    .lines {
      font-family: 'Courier New', Courier, monospace;
      font-size: 13px;
      font-weight: bold;
      fill: #222;
    }
    @media (prefers-color-scheme: dark) {
      .lines { fill: #ccc; }
      .ascii { fill: #FF6B6F; }
    }
  </style>

  <!-- Shadow -->
  <ellipse class="shadow" cx="150" cy="195" rx="40" ry="6" fill="#FF3B3F" opacity="0.3"/>

  <!-- Bouncing group -->
  <g class="ball-group">
    <!-- Spinning ball -->
    <g class="ball-spin">
      <text class="ascii" x="150" y="50"  text-anchor="middle">    ___     </text>
      <text class="ascii" x="150" y="65"  text-anchor="middle">  /  🏀  \  </text>
      <text class="ascii" x="150" y="80"  text-anchor="middle"> |---+---|  </text>
      <text class="ascii" x="150" y="95"  text-anchor="middle"> |   |   |  </text>
      <text class="ascii" x="150" y="110" text-anchor="middle"> |---+---|  </text>
      <text class="ascii" x="150" y="125" text-anchor="middle">  \_____/  </text>
    </g>
  </g>

  <!-- Label -->
  <text class="lines" x="150" y="215" text-anchor="middle" font-size="11" opacity="0.6">// ball.spin()</text>
</svg>
